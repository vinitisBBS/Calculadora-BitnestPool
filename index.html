<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitnest Loop</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bitnest-green: #00ffaa;
            --bg-dark: #121212;
            --card-bg: #222222;
            --input-bg: #333333;
            --text-gray: #999999;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header-logo {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-svg {
            width: 180px;
            height: auto;
        }

        .calc-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 28px;
            border-radius: 28px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .section-title {
            color: var(--bitnest-green);
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 10px;
        }

        .input-wrapper {
            background-color: var(--input-bg);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 100%;
            outline: none;
            font-weight: 500;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }

        .duration-btn {
            background-color: transparent;
            border: 1px solid #444;
            color: white;
            padding: 12px 0;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .duration-btn.active {
            border-color: var(--bitnest-green);
            background-color: rgba(0, 255, 170, 0.1);
            color: var(--bitnest-green);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .result-value {
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: white;
            text-align: center;
        }

        .footer b {
            color: var(--bitnest-green);
        }
    </style>
</head>
<body>

    <div class="header-logo">
        <svg class="logo-svg" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 10L10 25H25L15 40" stroke="#00ffaa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="45" y="32" fill="white" font-family="Arial" font-weight="bold" font-size="24">BITNEST</text>
            <rect x="155" y="15" width="40" height="18" rx="9" stroke="#00ffaa" stroke-width="1"/>
            <text x="160" y="28" fill="#00ffaa" font-family="Arial" font-size="9">LOOP</text>
        </svg>
    </div>

    <div class="calc-card">
        <div class="section-title">Circulação</div>
        
        <div class="label-row">
            <span>Quantidade (USDT)</span>
        </div>
        <div class="input-wrapper">
            <input type="number" id="valorInput" placeholder="Ex: 1000" oninput="calcular()">
        </div>

        <div class="label-row">
            <span>Quantidade de Ciclos</span>
        </div>
        <div class="input-wrapper">
            <input type="number" id="ciclosInput" placeholder="Número de repetições" value="1" oninput="calcular()">
        </div>

        <div class="label-row">
            <span>Duração por Ciclo</span>
        </div>
        <div class="duration-grid">
            <button class="duration-btn active" onclick="setPrazo(0.004, this, '1 Dia')">1 Dia</button>
            <button class="duration-btn" onclick="setPrazo(0.04, this, '7 Dias')">7 Dias</button>
            <button class="duration-btn" onclick="setPrazo(0.095, this, '14 Dias')">14 Dias</button>
            <button class="duration-btn" onclick="setPrazo(0.24, this, '28 Dias')">28 Dias</button>
        </div>

        <div class="result-row">
            <span id="labelDias" style="color: var(--text-gray);">Total após ciclos</span>
            <span class="result-value" id="displayTotal">0.00 USDT</span>
        </div>
    </div>

    <div class="footer">
        Desenvolvido por <b>vinitisBBS</b>
    </div>

    <script>
        let taxaAtual = 0.004;

        function setPrazo(taxa, elemento, texto) {
            taxaAtual = taxa;
            document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            calcular();
        }

        function calcular() {
            const valor = parseFloat(document.getElementById('valorInput').value) || 0;
            const ciclos = parseInt(document.getElementById('ciclosInput').value) || 0;
            
            // Fórmula de Juros Compostos: M = P * (1 + i)^n
            const total = valor * Math.pow((1 + taxaAtual), ciclos);
            
            document.getElementById('displayTotal').innerText = total.toLocaleString('en-US', {
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2
            }) + " USDT";
        }
    </script>
</body>
</html>
